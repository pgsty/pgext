  logo: icons/pgext-mark.svg
  images:
    - logo.png

  version: v1.1.0
  productionURL: &productionURL https://ext.pgsty.com
  github_repo: https://github.com/pgsty/pgext
  github_project_repo: https://github.com/pgsty/pgext
  github_branch: main
  github_subdir: ''

  copyright:
    authors: >-
      [Ruohang Feng](https://vonng.com/en/) ([@Vonng](https://github.com/Vonng))
      @ [PGSTY](https://pgsty.com/)
    from_year: 2018
    to_year: present
  footer_center_info: 'Powered by [Oink](https://oink.pgsty.com)'

  # The catalog pages are wide data sheets; the shell defaults to the wide
  # reading measure and the generated pages ask for `page_width: full`.
  page_width: wide

  time_format_blog: 2006-01-02
  time_format_default: 2006-01-02

  # Local Lunr search over titles, headings and descriptions. Indexing the
  # bodies would mean indexing several hundred megabytes of package tables.
  offline_search: true
  offline_search_on_serve: true
  offline_search_index: summary
  offline_search_summary_length: 90
  offline_search_max_results: 12

  comments: false

  print:
    toc: true

  ui:
    typography: technical
    dark_mode: true

    # Sidebar
    #
    # The tree roots at the current top-level section rather than the whole
    # site: `/e` alone holds 575 sibling pages, and re-emitting that list on
    # every page of every other section is pure weight.
    sidebar_root_enabled: false
    sidebar_root_menu: true
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_expand_levels: 2
    sidebar_width_min: 220
    sidebar_width_max: 460
    sidebar_item_overflow: ellipsis
    sidebar_icon_policy: groups
    sidebar_cache_limit: 400

    # Chrome
    navbar_enabled: true
    navbar_autohide: false
    footer_style: fat
    landing_search: true
    breadcrumb: true
    section_index: cards
    section_index_columns: 2
    quick_links: [e, os, repo]

    toc_style: fixed
    toc_taxonomies: true

    lastmod_commit: subject
    annotation: false
    reading_time: false
    keyboard_nav: true
    image_zoom: true

    taxonomy_icons:
      categories: fa-solid fa-folder-tree
      languages: fa-solid fa-code
      licenses: fa-solid fa-scale-balanced
      repos: fa-solid fa-warehouse

    page_context_menu:
      enable: true
      assistant_links: false
      links: []

    feedback:
      enable: false
