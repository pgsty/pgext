#==============================================================#
# File      :   hugo.yaml
# Desc      :   PGEXT.CLOUD static site configuration (OINK 0.6.0)
# Path      :   hugo.yaml
# Copyright (C) 2019-2026 Ruohang Feng
#==============================================================#

#---------------------------------------------------------------#
# Basics
#---------------------------------------------------------------#
# The static catalog publishes at ext.pgsty.com; the dynamic `pgext serve`
# app keeps pgext.cloud. Both carry the PGEXT.CLOUD name.
baseURL: 'https://ext.pgsty.com/'
title: 'PGEXT.CLOUD'

defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: true
capitalizeListTitles: false

pagination:
  pagerSize: 100

# Google Analytics 4: this site's own stream, carried over from pgext.cloud so
# the history stays in one property. Injected only in production builds (OINK
# wraps the partial in `hugo.IsProduction`), so `hugo serve` stays clean.
services:
  googleAnalytics:
    ID: G-5HDLR6CMB4

security:
  http:
    methods: ['(?i)GET|POST']
    urls: ['(?i)^https?://[a-z].*']

#---------------------------------------------------------------#
# OINK theme module
#---------------------------------------------------------------#
module:
  hugoVersion:
    extended: true
    min: '0.160.1'
  imports:
    - path: github.com/pgsty/oink
  mounts:
    # English sources plus colocated `.zh.md` translations.
    - source: content
      target: content
      sites:
        matrix:
          languages: [en, zh]
    # The catalog's own CSV exports, so the home page can build its search
    # payload from the same rows `pgext gen` writes the pages from. Declaring
    # an assets mount replaces the default, so the site's own assets/ is
    # restated here.
    - source: assets
      target: assets
    - source: db
      target: assets/db
    # The global matrix's own export, so its page can be rendered from the
    # same rows `pgext gen matrix` writes for the standalone viewer.
    - source: static/matrix
      target: assets/matrix

#---------------------------------------------------------------#
# Outputs
#---------------------------------------------------------------#
# `markdown` / `print` stay off: 1,300+ generated catalog pages carry very
# large availability matrices, and a second full render of each is not worth
# the build cost. `LLMS` is a single cheap file that lists the site for agents.
outputs:
  home: [HTML, RSS, LLMS]
  page: [HTML]
  section: [HTML, RSS]

#---------------------------------------------------------------#
# Markdown
#---------------------------------------------------------------#
markup:
  goldmark:
    renderer:
      unsafe: true # generated pages embed raw HTML (matrix, legends)
    parser:
      autoHeadingID: true
      autoHeadingIDType: github
      # Block images can carry an attribute line; `{.cards}` / `{.steps}`
      # markers need block attributes. Both are OINK component requirements.
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      # Chinese paragraphs are wrapped in the source like every other
      # paragraph, but a soft line break between two East Asian characters
      # would render as a visible space. This drops it; Latin text, where the
      # space is wanted, is untouched.
      cjk:
        enable: true
        eastAsianLineBreaks: true
        eastAsianLineBreaksStyle: simple
        escapedSpace: true
  highlight:
    noClasses: false # required so code follows the light/dark palettes
    codeFences: true
    style: tango
  tableOfContents:
    startLevel: 2
    endLevel: 3

#---------------------------------------------------------------#
# Taxonomy
#---------------------------------------------------------------#
# Every packaged extension page carries `categories: [<CATE>]`, so the term
# pages become a real second axis through the catalog.
taxonomies:
  category: categories
  language: languages
  license: licenses
  repo: repos

#---------------------------------------------------------------#
# Cascade
#---------------------------------------------------------------#
# Everything except the home page reads as documentation, so it gets OINK's
# docs shell: sidebar tree, outline, breadcrumb, pager. Targeting by kind
# rather than putting the cascade in content/_index.md keeps the home page
# itself on the landing layout.
cascade:
  - target:
      kind: '{section,page}'
    type: docs
  # The platform and catalog pages are one very wide table each. They carry no
  # taxonomy of their own, so dropping the term clouds lets an OS page give the
  # whole canvas to its matrix instead of reserving an empty right rail.
  - target:
      path: '{/os/**,/list/**}'
    toc_taxonomies: false
  # Dimension pages are indexes, not documents. The extension tree in the
  # sidebar has nothing to say about them, and the right rail's term clouds
  # already carry the navigation, so they get the whole canvas for their wall.
  - target:
      kind: '{taxonomy,term}'
    page_width: full
    sidebar_enabled: false

