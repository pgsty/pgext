<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PGEXT">
  <title>PGEXT</title>
  <defs>
    <linearGradient id="pgx-core" x1="3" y1="3" x2="47" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5aa0d8"/>
      <stop offset="0.55" stop-color="#336791"/>
      <stop offset="1" stop-color="#1c4260"/>
    </linearGradient>
    <linearGradient id="pgx-ext" x1="26" y1="26" x2="61" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0a35c"/>
      <stop offset="1" stop-color="#b4762e"/>
    </linearGradient>
    <mask id="pgx-notch">
      <rect width="64" height="64" fill="#fff"/>
      <!-- The extension tile, grown by 3px, is cut out of the core, so a
           hairline of page background separates the two bodies at every size. -->
      <path d="M23 23h30a8 8 0 0 1 8 8v30a8 8 0 0 1-8 8H31a8 8 0 0 1-8-8Z" fill="#000"/>
    </mask>
  </defs>
  <!-- The core: the PostgreSQL kernel. -->
  <path mask="url(#pgx-notch)" fill="url(#pgx-core)"
        d="M13 3h24a10 10 0 0 1 10 10v24a10 10 0 0 1-10 10H13A10 10 0 0 1 3 37V13A10 10 0 0 1 13 3Z"/>
  <!-- The extension: the part that docks into it. -->
  <path fill="url(#pgx-ext)"
        d="M26 26h27a8 8 0 0 1 8 8v19a8 8 0 0 1-8 8H34a8 8 0 0 1-8-8Z"/>
  <!-- Connector pins. -->
  <circle cx="15" cy="15" r="4.5" fill="#eaf4fd" opacity="0.94"/>
  <circle cx="35" cy="15" r="3" fill="#eaf4fd" opacity="0.5"/>
  <circle cx="15" cy="35" r="3" fill="#eaf4fd" opacity="0.5"/>
  <circle cx="52" cy="52" r="4" fill="#3a2a12" opacity="0.35"/>
</svg>
