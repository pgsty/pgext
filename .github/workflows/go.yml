name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 03 * * 1"

# Cancel superseded runs for the same PR; never cancel main push runs.
# Keyed on PR number (not head_ref) so fork PRs sharing a branch name
# do not collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, Vet, Build, Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          mapfile -t unformatted < <(gofmt -l main.go cli cmd db server)
          if [ "${#unformatted[@]}" -ne 0 ]; then
            echo "The following files are not gofmt-formatted:"
            printf '%s\n' "${unformatted[@]}"
            gofmt -d "${unformatted[@]}"
            exit 1
          fi

      - name: Check stub Markdown
        run: go run . gen lint

      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test frontend behavior
        run: node --test server/*_test.mjs

      - name: Check build targets and supplement policy
        run: python3 -m unittest -v bin/test_rebuild_manifest.py

      - name: Test bilingual changelog generation
        run: python3 -m unittest -v bin/test_changelog.py

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  changelog-drift:
    name: Compare Changelog with Published Release Notes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check out the site release notes
        uses: actions/checkout@v7
        with:
          repository: pgsty/pgext.cloud
          path: .pgext-site
          sparse-checkout: content/release
          persist-credentials: false
      - name: Check bilingual package changelog
        run: |
          python3 bin/changelog.py -D .pgext-site
          git diff --exit-code -- db/changelog.csv

  package:
    name: Snapshot Packages
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the snapshot version from the tag history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Builds every release target and both package formats without
      # publishing, so a broken .goreleaser.yml fails here rather than on
      # the tag that was supposed to ship.
      - name: Build snapshot with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --snapshot --skip=publish

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-snapshot
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/checksums.txt
