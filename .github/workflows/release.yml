name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so GoReleaser can build the changelog.
          fetch-depth: 0
          # Build the code at the tag being released, not whatever branch the
          # dispatch ran from. On a tag push this is the tag ref already.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate release tag
        env:
          # Passed through the environment rather than spliced into the script
          # body, so a dispatch input stays data and cannot inject commands.
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag format: ${TAG} (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          echo "Releasing ${TAG}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Publishes a draft release (release.draft in .goreleaser.yml): the
      # tarballs, rpm/deb packages and checksums are uploaded, but nothing is
      # visible until the draft is published by hand.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          retention-days: 14
          path: dist/
