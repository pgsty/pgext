faq:
  eyebrow: Before you depend on it
  title: The questions that decide whether this is usable
  items:
    - question: Does this replace or fork the PostgreSQL kernel?
      answer: >-
        No. The kernel comes from
        [PGDG](https://www.postgresql.org/download/linux/), unmodified, and
        these packages are built to sit beside it: the same package naming,
        the same `$libdir` and extension directories, the same
        `postgresql-$v-*` and `*_$v` conventions. An extension installed from
        here works with a kernel installed from PGDG, and removing this
        repository leaves a working database behind.
      open: true
    - question: What does "packaged" actually guarantee?
      answer: >-
        That the extension builds reproducibly from source against each
        supported PostgreSQL major on each supported platform, that the result
        is a signed RPM or DEB with correct dependencies, and that the
        [availability matrix](os/matrix/) says so cell by cell. It does not
        mean the extension is production-ready — that judgement is still
        yours, and the catalog gives you the licence, activity and maintenance
        signals to make it.
    - question: Which platforms and PostgreSQL versions are covered?
      answer: >-
        Eight distribution releases — RockyLinux 8, 9 and 10, Debian 12 and
        13, Ubuntu 22.04, 24.04 and 26.04 — on both `x86_64` and `aarch64`,
        which is the sixteen targets counted above. PostgreSQL 14 through 18
        on each. ARM is a first-class target, not an afterthought:
        [the matrix](os/matrix/) shows where the two architectures differ.
    - question: What is in the catalog that is not packaged?
      answer: >-
        Most of it. Of 2,241 catalogued extensions, 576 are built here; the
        rest are indexed because knowing an extension exists — with its
        repository, licence, language and last commit — is useful even when
        nobody has packaged it. Provider-only extensions from managed clouds
        are catalogued too, marked as such.
    - question: Is there anything proprietary or paid here?
      answer: >-
        No. The build specifications
        ([RPM](https://github.com/pgsty/rpm), [DEB](https://github.com/pgsty/deb)),
        this catalog, and the `pig` CLI are all open source, and the
        repository is free to use. A handful of *catalogued* extensions carry
        source-available or copyleft licences of their own — the
        [licence index](list/license/) sorts by obligation so you can see
        which before you install.
    - question: Something is missing or wrong. What then?
      answer: >-
        Open an issue on [pgsty/pgext](https://github.com/pgsty/pgext/issues).
        New extensions get catalogued on request, and packaging requests are
        taken seriously — a large part of the 576 arrived that way.

