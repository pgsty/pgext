install:
  eyebrow: Install
  title: One line to the package manager, four to a database
  code: |-
    curl -fsSL https://repo.pigsty.io/pig | bash   # install the pig CLI
    pig repo set                                   # add pgdg + pigsty repos
    pig install pg18                               # PostgreSQL 18 from PGDG
    pig install pg_duckdb -v 18                    # any of 576 extensions
  lang: bash
  note: >-
    `pig` speaks `apt` and `dnf` underneath, so nothing here is a private
    package format — the same packages install by hand.

capabilities:
  eyebrow: What is here
  title: Find it. Install it. Trust it.
  text: >-
    Three layers, each usable on its own: an index of what exists, a
    repository of what is built, and a CLI that ties them to your machine.
  items:
    - ref: 01 / CATALOG
      title: Know what actually exists
      url: list/
      motto: Sixteen categories, one page each
      bullets:
        - '**2,241 extensions** indexed by [category](list/cate/),
          [language](list/lang/) and [licence](list/license/)'
        - 'Every entry carries its version, dependencies, `shared_preload_libraries`
          needs, trust and relocatability flags'
        - 'Cross-links between families — `postgis` and its four siblings read
          as one project, not five rows'
      value: The search that used to take an afternoon takes a minute.
      visual:
        type: components
        aria_label: Browse the catalog by category
        columns: 4
        compact: true
        items:
          - { icon: fa-solid fa-clock, title: TIME, url: list/cate/#time }
          - { icon: fa-solid fa-globe, title: GIS, url: list/cate/#gis }
          - { icon: fa-solid fa-lightbulb, title: RAG, url: list/cate/#rag }
          - { icon: fa-solid fa-magnifying-glass, title: FTS, url: list/cate/#fts }
          - { icon: fa-solid fa-chart-column, title: OLAP, url: list/cate/#olap }
          - { icon: fa-solid fa-wand-magic-sparkles, title: FEAT, url: list/cate/#feat }
          - { icon: fa-solid fa-code, title: LANG, url: list/cate/#lang }
          - { icon: fa-solid fa-cube, title: TYPE, url: list/cate/#type }
          - { icon: fa-solid fa-gear, title: UTIL, url: list/cate/#util }
          - { icon: fa-solid fa-superscript, title: FUNC, url: list/cate/#func }
          - { icon: fa-solid fa-building, title: ADMIN, url: list/cate/#admin }
          - { icon: fa-solid fa-arrow-trend-up, title: STAT, url: list/cate/#stat }
          - { icon: fa-solid fa-shield-halved, title: SEC, url: list/cate/#sec }
          - { icon: fa-solid fa-database, title: FDW, url: list/cate/#fdw }
          - { icon: fa-solid fa-clone, title: SIM, url: list/cate/#sim }
          - { icon: fa-solid fa-truck, title: ETL, url: list/cate/#etl }
    - ref: 02 / REPOSITORY
      title: Packages, not build instructions
      url: repo/
      motto: Native RPM and DEB, built the boring way
      bullets:
        - '576 extensions across **16 Linux targets** and
          [five PostgreSQL majors](os/matrix/)'
        - 'Designed to sit beside [PGDG](repo/pgdg/), not replace it: same
          naming, same paths, same `postgresql-$v-*` conventions'
        - 'Every package signed; the whole repository served from a global CDN'
      value: Your existing apt and dnf workflow does not change.
      visual:
        type: card
        icon: fa-solid fa-warehouse
        title: repo.pigsty.io
        lines:
          - '**EL 8 / 9 / 10** · RockyLinux, RHEL and compatibles'
          - '**Debian 12 / 13** · Ubuntu 22.04 / 24.04 / 26.04'
          - 'Both `x86_64` and `aarch64`, at parity'
          - 'GPG-signed, [verifiable keys](repo/gpg/)'
          - 'Mirrored in mainland China at `repo.pigsty.cc`'
    - ref: 03 / PIG
      title: One CLI for kernel and extensions alike
      url: pig/
      motto: Postgres Install Genius
      bullets:
        - '`pig repo` writes the right repository files for your
          distribution — no hand-edited `sources.list`'
        - '`pig ext` searches, installs and removes extensions by their
          **canonical name**, whatever the package is called on your OS'
        - 'Also manages the kernel, `pgbackrest` restores, and whole Pigsty
          deployments'
      value: One name works on Rocky, Debian and Ubuntu alike.
      visual:
        type: code
        aria_label: Example pig session
        title: pig
        lines:
          - { class: c, prefix: '# ', text: 'one name, every distribution' }
          - { class: p, prefix: '$ ', text: 'pig ext install pgvector' }
          - { class: ok, prefix: '✓ ', text: 'resolved  vector 0.8.1' }
          - { class: ok, prefix: '✓ ', text: 'installed pgvector_18 (el9.x86_64)' }
          - { class: c, prefix: '# ', text: 'now enable it in the database' }
          - { class: p, prefix: '$ ', text: 'psql -c ''CREATE EXTENSION vector''' }

