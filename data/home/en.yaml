steps:
  eyebrow: Get started
  title: From a bare Linux box to an extended database
  items:
    - title: Install the package manager
      icon: fa-solid fa-download
      desc: A single static binary, no runtime dependencies.
      cmd: { code: 'curl -fsSL https://repo.pigsty.io/pig | bash' }
    - title: Add the repositories
      icon: fa-solid fa-warehouse
      desc: Writes the PGDG and Pigsty repository files your distribution expects, then refreshes the cache.
      cmd: { code: 'pig repo add all -u' }
    - title: Install a PostgreSQL kernel
      icon: fa-solid fa-database
      desc: Straight from PGDG — this catalog does not fork the kernel.
      cmd: { code: 'pig install pg18' }
    - title: Add the extensions you want
      icon: fa-solid fa-puzzle-piece
      desc: By canonical name, then enable it in the database as usual.
      cmd: { code: 'pig install pgvector postgis timescaledb -v 18' }

