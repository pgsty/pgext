          - { icon: fa-solid fa-building, title: ADMIN, url: list/cate/#admin }
          - { icon: fa-solid fa-arrow-trend-up, title: STAT, url: list/cate/#stat }
          - { icon: fa-solid fa-shield-halved, title: SEC, url: list/cate/#sec }
          - { icon: fa-solid fa-database, title: FDW, url: list/cate/#fdw }
          - { icon: fa-solid fa-clone, title: SIM, url: list/cate/#sim }
          - { icon: fa-solid fa-truck, title: ETL, url: list/cate/#etl }
    - ref: 02 / 仓库
      title: 给的是软件包，不是编译教程
      url: repo/
      motto: 原生 RPM 与 DEB，用最无聊的方式构建
      bullets:
        - '576 个扩展 × **16 个 Linux 目标** × [五个 PostgreSQL 大版本](os/matrix/)'
        - '设计目标是与 [PGDG](repo/pgdg/) 并存而非取代：相同的命名、相同的路径、相同的 `postgresql-$v-*` 约定'
