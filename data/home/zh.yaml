        - '每一条都带着版本、依赖、是否需要 `shared_preload_libraries`、是否可信、能否重定位'
        - '同族扩展互相关联 —— `postgis` 和它的四个兄弟读起来是一个项目，而不是五行互不相干的记录'
      value: 以前要花一下午的调研，现在一分钟。
      visual:
        type: components
        aria_label: 按分类浏览目录
        columns: 4
        compact: true
