faq:
  eyebrow: 在依赖它之前
  title: 决定这东西能不能用的几个问题
  items:
    - question: 这会替换或分叉 PostgreSQL 内核吗？
      answer: '不会。内核直接来自 [PGDG](https://www.postgresql.org/download/linux/)，未经改动；这些软件包的设计目标就是与之并存：相同的包命名、相同的 `$libdir` 与扩展目录、相同的 `postgresql-$v-*` 与 `*_$v` 约定。从这里装的扩展能配 PGDG 装的内核使用，把这个仓库移除之后，留下的仍然是一个能正常工作的数据库。'
      open: true
    - question: 「已打包」到底保证了什么？
      answer: '保证这个扩展能在每个受支持的平台上、针对每个受支持的 PostgreSQL 大版本，从源码可复现地构建出来；保证产物是依赖正确、带签名的 RPM 或 DEB；并且 [可用性矩阵](os/matrix/) 会逐格告诉你结果。它并不保证这个扩展「适合上生产」—— 那个判断仍然是你的，目录会把许可证、活跃度与维护状况这些信号摆给你。'
    - question: 覆盖哪些平台和 PostgreSQL 版本？
      answer: '八个发行版大版本 —— RockyLinux 8 / 9 / 10，Debian 12 / 13，Ubuntu 22.04 / 24.04 / 26.04 —— 每个都提供 `x86_64` 与 `aarch64` 两种架构，合起来就是上面那 16 个目标；每个目标上覆盖 PostgreSQL 14 到 18。ARM 是一等公民而非附带品：[矩阵页](os/matrix/) 会明确标出两种架构的差异之处。'
    - question: 目录里那些没打包的是什么？
      answer: 大多数都没打包。2241 个收录扩展中有 576 个在这里构建，其余之所以收录，是因为「知道它存在」本身就有价值 —— 仓库地址、许可证、实现语言、最后一次提交，即便没人打包也值得记录。托管云厂商专有的扩展同样收录，并明确标注。
    - question: 有没有闭源或收费的部分？
      answer: '没有。构建规范（[RPM](https://github.com/pgsty/rpm)、[DEB](https://github.com/pgsty/deb)）、这份目录、`pig` 命令行工具全部开源，仓库本身免费使用。少数**被收录的**扩展自身采用源码可见或传染性许可证 —— [许可证索引](list/license/) 按约束强度排序，装之前就能看清楚。'
    - question: 发现缺了或者错了，怎么办？
      answer: '去 [pgsty/pgext](https://github.com/pgsty/pgext/issues) 提 issue。新扩展可以按需收录，打包请求也会被认真对待 —— 那 576 个里有相当一部分正是这么来的。'

