          - { icon: fa-solid fa-wand-magic-sparkles, title: FEAT, url: list/cate/#feat }
          - { icon: fa-solid fa-code, title: LANG, url: list/cate/#lang }
          - { icon: fa-solid fa-cube, title: TYPE, url: list/cate/#type }
