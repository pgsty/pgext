install:
  eyebrow: 安装
  title: 一行装好包管理器，四行装好一整套数据库
  code: |-
    curl -fsSL https://repo.pigsty.io/pig | bash   # 安装 pig 命令行工具
    pig repo set                                   # 添加 PGDG 与 Pigsty 仓库
    pig install pg18                               # 从 PGDG 安装 PostgreSQL 18
    pig install pg_duckdb -v 18                    # 576 个扩展，任选
  lang: bash
  note: '`pig` 底层说的就是 `apt` 和 `dnf`，这里没有任何私有包格式 —— 同样的软件包，手工安装一样可以。'

capabilities:
  eyebrow: 这里有什么
  title: 找得到，装得上，敢用。
  text: 三层能力，每一层都可以单独使用：一份「有什么」的索引，一个「已经构建好」的仓库，以及把两者接到你机器上的命令行工具。
