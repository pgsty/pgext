version: 2

env:
  - CGO_ENABLED=0

before:
  hooks:
    # Download only: a release must build the committed module graph, never
    # rewrite go.mod on its way out. Tidiness is enforced by the CI workflow.
    - go mod download

builds:
  - id: pgext
    main: ./main.go
    binary: pgext
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: pgext
    name_template: >-
      {{ .ProjectName }}-v{{ .Version }}.
      {{- if eq .Os "darwin" }}darwin{{- else }}{{ .Os }}{{- end }}-
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}

nfpms:
  - id: pgext-packages
    package_name: pgext
    # Package names carry the PGSTY release segment, PGDG-style: nfpm renders
    # `release` as the RPM Release tag and as the Debian revision after the
    # dash, and these names must agree with it.
    file_name_template: >-
      {{ .PackageName }}
      {{- if eq .Format "deb" }}_{{ .Version }}-1PGSTY_
        {{- if eq .Arch "amd64" }}amd64
        {{- else if eq .Arch "arm64" }}arm64
        {{- else }}{{ .Arch }}{{ end }}
      {{- else if eq .Format "rpm" }}-{{ .Version }}-1PGSTY.
        {{- if eq .Arch "amd64" }}x86_64
        {{- else if eq .Arch "arm64" }}aarch64
        {{- else }}{{ .Arch }}{{ end }}
      {{- end }}
    vendor: "PGSTY"
    homepage: "https://ext.pgsty.com"
    maintainer: "Ruohang Feng <rh@vonng.com>"
    description: |
      PostgreSQL Extension Package Manager and CLI Tool
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/pgext/LICENSE
        file_info:
          mode: 0644
    release: "1PGSTY"
    rpm:
      summary: "PostgreSQL Extension Catalog Util"
      group: "Applications/Databases"


checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  # .Version, not .Tag: the tag carries a leading `v` that the archive and
  # package name templates add back themselves.
  version_template: "{{ .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: pgsty
    name: pgext
  # Artifacts are uploaded to a draft; publishing stays a manual step.
  draft: true
  prerelease: false
  mode: replace
  replace_existing_artifacts: true
  name_template: "{{.ProjectName}}-v{{.Version}}"
  disable: false

announce:
  skip: true
